# Production stack for the VPS (e.g. Singapore region):
#   cp deploy/.env.production.example deploy/.env.production   # fill in secrets
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build
#
# The website/front end is deployed separately on Vercel.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: terrago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: terrago
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U terrago']
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the internet; only the game server can reach it.

  game-server:
    build:
      context: ..
      dockerfile: deploy/game-server.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://terrago:${POSTGRES_PASSWORD}@db:5432/terrago
      WEB_ORIGINS: ${WEB_ORIGINS:?set WEB_ORIGINS, e.g. https://terrago.gg}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TRUST_PROXY: 'true'
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: info
    stop_grace_period: 15s
    expose:
      - '4000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - game-server
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN, e.g. api.terrago.gg}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
