# Local development services.
#   docker compose up -d db        # PostgreSQL only (run server/web with npm run dev)
#   docker compose up -d           # also Redis (reserved for multi-process scaling; unused in v0.1)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: terrago
      POSTGRES_PASSWORD: terrago_dev_password
      POSTGRES_DB: terrago
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U terrago']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ['redis']
    ports:
      - '6379:6379'

volumes:
  pgdata:
